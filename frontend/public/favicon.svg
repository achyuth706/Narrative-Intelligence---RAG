<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a78d6"/>
      <stop offset="55%" stop-color="#3f5fd0"/>
      <stop offset="100%" stop-color="#4a3aa7"/>
    </linearGradient>
    <!-- knocks the Hancock X-bracing and the Willis tube seam out of the
         white towers, so the background gradient shows through them -->
    <mask id="cut">
      <rect width="48" height="48" fill="#fff"/>
      <g stroke="#000" stroke-width="0.62" stroke-linecap="square">
        <line x1="9"    y1="16"   x2="18.25" y2="28.5"/>
        <line x1="17"   y1="16"   x2="7.75"  y2="28.5"/>
        <line x1="7.75" y1="28.5" x2="19.5"  y2="41"/>
        <line x1="18.25" y1="28.5" x2="6.5"  y2="41"/>
      </g>
      <rect x="31.7" y="10" width="0.7" height="7" fill="#000"/>
    </mask>
  </defs>

  <rect width="48" height="48" rx="11" fill="url(#bg)"/>

  <g fill="#fff" mask="url(#cut)">
    <!-- John Hancock Center: tapered slab, X-braced, twin antennas -->
    <path d="M6.5 41 L9 16 L17 16 L19.5 41 Z"/>
    <rect x="11" y="8" width="1.3" height="8"/>
    <rect x="14.4" y="8" width="1.3" height="8"/>

    <!-- Willis Tower: bundled tubes stepping back, twin antennas -->
    <rect x="22.5" y="24" width="19" height="17"/>
    <rect x="25" y="17" width="14" height="7"/>
    <rect x="27.5" y="10" width="9" height="7"/>
    <rect x="28.9" y="4" width="1.3" height="6"/>
    <rect x="33.8" y="4" width="1.3" height="6"/>
  </g>
</svg>
